<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Housie</title><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#4B3FE0"><link rel="apple-touch-icon" href="/icon-192.png">
<style>:root{--bg:#F4F5FB;--c:#fff;--ink:#16163A;--m:#6B6E93;--l:#E4E5F2;--p:#4B3FE0}*{box-sizing:border-box;margin:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:70px}
.w{max-width:900px;margin:0 auto;padding:16px}h1{font-size:22px}.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:14px;margin-bottom:10px}
input,select,textarea,button{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--l);max-width:100%}button{background:var(--p);color:#fff;border:0;font-weight:700;cursor:pointer}button.g{background:#fff;color:var(--ink);border:1px solid var(--l)}
.f{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.s{font-size:12px;color:var(--m)}.tag{font-size:11px;font-weight:700;background:var(--p);color:#fff;border-radius:99px;padding:2px 8px}
.sc{font-weight:800;padding:2px 8px;border-radius:8px;background:#eee}.hot{background:#fde1e7;color:#d0284a}.warm{background:#fff0d0;color:#9a6100}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#16163A;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}nav button{flex:1;background:none;color:#cfd0f5;font-size:13px}nav button.on{background:var(--p);color:#fff}
.m{padding:8px 12px;border-radius:12px;margin:4px 0;max-width:80%;font-size:14px}.in{background:#eceefa}.out{background:#d6f8e4;margin-left:auto}.ph{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}.th{position:relative;flex:none;width:96px;height:72px}.th img{width:100%;height:100%;object-fit:cover;border-radius:10px}.x{position:absolute;top:2px;right:2px;width:28px;height:28px;border-radius:50%;padding:0;background:#000a;color:#fff;border:0}.cv{position:absolute;left:3px;bottom:3px;font-size:10px;padding:3px 7px;border-radius:99px;background:#fffd;color:#16163A;border:0}.cv.on{background:var(--p);color:#fff}.add{flex:none;width:96px;height:72px;border:1.5px dashed var(--l);border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--p);cursor:pointer}</style></head><body><div class="w" id="app"></div><nav id="nav" hidden></nav>
<script>
let ME=null,T=localStorage.t,view='leads',data={},chat=null;const $=s=>document.querySelector(s);
const api=async(p,m='GET',b)=>{const r=await fetch('/api'+p,{method:m,headers:{'content-type':'application/json',authorization:'Bearer '+T},body:b&&JSON.stringify(b)});const d=await r.json().catch(()=>({}));if(r.status===401&&T){logout()}if(!r.ok){const e=new Error(d.error||'Error');e.data=d;throw e};return d};
const logout=()=>{localStorage.removeItem('t');T=null;ME=null;draw()};
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function auth(kind){try{const r=await api('/'+kind,'POST',{name:$('#n')?.value,email:$('#e').value,password:$('#pw').value,phone:$('#ph')?.value,invite:new URLSearchParams(location.search).get('invite')});T=r.token;localStorage.t=T;ME=null;view='leads';draw()}catch(e){alert(e.message)}}
const ST=['New','Contacted','Visit Scheduled','Negotiation'];
async function draw(){
 const A=$('#app'),N=$('#nav');
 if(!T){N.hidden=true;A.innerHTML=`<div class="card"><h1>🏠 Housie</h1><p class="s" style="margin:6px 0 12px">Leads, ads and WhatsApp in one place.</p>${new URLSearchParams(location.search).get('invite')?'<p><b>You were invited to join a team. Sign up to continue.</b></p>':''}<div class="f"><input id="n" placeholder="Name (sign up)"><input id="ph" placeholder="Phone"><input id="e" placeholder="Email"><input id="pw" type="password" placeholder="Password"></div><div class="f"><button onclick="auth('login')">Log in</button><button class="g" onclick="auth('register')">Sign up</button></div></div>`;return}
 N.hidden=false;try{ME=ME||await api('/me')}catch{}const own=!ME||ME.role==='owner';N.innerHTML=[['leads','👥 Leads'],['props','🏘️ Listings'],['ads','📣 Ads'],['visits','📅 Visits'],['team','👤 Team'],['set','⚙️ Setup']].filter(t=>own||!['ads','set','team'].includes(t[0])).map(t=>`<button class="${view===t[0]?'on':''}" onclick="view='${t[0]}';chat=null;draw()">${t[1]}</button>`).join('');
 try{
 if(view==='leads'){const L=data.l=await api('/leads');const TM=own?await api('/team').then(x=>x.members).catch(()=>[]):[];
  if(chat){const l=L.find(x=>x.id===chat),M=await api(`/leads/${chat}/messages`);A.innerHTML=`<button class="g" onclick="chat=null;draw()">← Back</button><h1 style="margin:10px 0">${E(l.name)} <span class="s">${E(l.phone)}</span></h1><div class="card">${M.map(m=>`<div class="m ${m.dir}">${E(m.body)}</div>`).join('')||'<span class=s>No messages yet</span>'}</div><div class="f"><input id="mb" style="flex:1" placeholder="Message"><button class="g" onclick="draft()">✨ AI draft</button><button onclick="send()">Send</button></div>`;return}
  A.innerHTML=`<h1>Leads</h1><div class="f" style="margin-top:10px"><input id="ln" placeholder="Name"><input id="lp" placeholder="Phone (91…)"><input id="lb" placeholder="Budget"><input id="ld" placeholder="Need"><button onclick="addLead()">+ Add</button></div>`+L.map(l=>`<div class="card"><div class="f" style="margin:0;justify-content:space-between"><b>${E(l.name)}</b><span class="sc ${l.score>=80?'hot':l.score>=60?'warm':''}">${l.score}</span></div><div class="s"><span class="tag">${E(l.source)}</span> ${E(l.budget)} ${E(l.need)}${l.assignee&&own&&TM.length>1?` · 👤 ${E(l.assignee)}`:''}</div><p class="s" style="margin:6px 0">✨ ${E(l.tip)}</p><div class="f" style="margin:0"><select onchange="stage(${l.id},this.value)">${ST.map((s,i)=>`<option value="${i}" ${l.stage==i?'selected':''}>${s}</option>`).join('')}</select><button class="g" onclick="chat=${l.id};draw()">💬 Chat</button></div></div>`).join('')}
 if(view==='props'){const P=data.p=await api('/properties');A.innerHTML=`<h1>My Listings</h1><div class="card f" style="margin-top:10px"><input id="pt" placeholder="Title (3BHK Boring Road)"><input id="pp" placeholder="Price"><input id="pa" placeholder="Area"><input id="pl" placeholder="Locality"><textarea id="pd" placeholder="Description" style="width:100%"></textarea><button class="g" onclick="desc()">✨ AI describe</button><button onclick="addProp()">Save</button></div>`+P.map(p=>`<div class="card"><div class="ph">${(p.photos||[]).map((id,i)=>`<div class="th"><img src="/photo/${id}" alt=""><button class="x" onclick="delPhoto(${id})" aria-label="Delete photo">×</button>${i?`<button class="cv" onclick="coverPhoto(${id})">Make cover</button>`:'<span class="cv on">Cover</span>'}</div>`).join('')}<label class="add">+ Photos<input type="file" accept="image/*" multiple hidden onchange="upPhotos(${p.id},this)"></label></div><b>${E(p.title)}</b> · ${E(p.price)}<div class="s">${E(p.locality)} ${E(p.area)}</div><div class="f" style="margin:8px 0 0"><button onclick="open('https://wa.me/?text='+encodeURIComponent('${E(p.title)} - ${E(p.price)}\\nView & book a visit: ${p.link}'))" style="background:#25D366;color:#06301a">Share on WhatsApp</button><button class="g" onclick="navigator.clipboard.writeText('${p.link}');alert('Link copied')">Copy link</button></div></div>`).join('')}
 if(view==='ads'){const S=await api('/meta/status').catch(()=>({}));
  if(!S.connected){A.innerHTML=`<h1>Ad Campaigns</h1><div class="card" style="margin-top:10px"><b>Connect Facebook & Instagram</b><p class="s" style="margin:6px 0 10px">Link your Facebook Page and ad account. Leads from your ads then arrive here automatically.</p>${S.configured?'<button onclick="metaLogin()">Connect with Facebook</button>':'<span class="s">The server owner must set META_APP_ID and META_APP_SECRET first.</span>'}</div>`;return}
  if(S.needs_pick){const O=await api('/meta/options');A.innerHTML=`<h1>Choose your accounts</h1><div class="card f" style="margin-top:10px"><select id="mp">${O.pages.map(p=>`<option value="${E(p.id)}">${E(p.name)}</option>`).join('')}</select><select id="ma">${O.accounts.map(x=>`<option value="${E(x.account_id)}">${E(x.name)} (${E(x.currency)})</option>`).join('')}</select><button onclick="metaPick()">Save</button></div><p class="s">Only active ad accounts are listed.</p>`;return}
  const C=await api('/campaigns'),P=await api('/properties');
  A.innerHTML=`<h1>Ad Campaigns</h1>${S.expired||(S.expiring_days!=null&&S.expiring_days<10)?`<div class="card" style="border-color:#E63946"><b>Facebook connection ${S.expired?'expired':'expires in '+S.expiring_days+' days'}.</b> <button onclick="metaLogin()">Reconnect</button></div>`:''}<div class="f" style="margin-top:10px"><button onclick="go(()=>api('/campaigns/sync','POST'))">⟳ Sync from Meta</button></div>`+(C.length?C.map(c=>`<div class="card"><div class="f" style="margin:0;justify-content:space-between"><b>${E(c.name)}</b><span class="s">${E(c.status)}</span></div><div class="s">Spend ₹${c.spend} · Meta leads ${c.leads} · ${c.impressions||0} views · ${c.clicks||0} clicks · Per lead ₹${c.leads?Math.round(c.spend/c.leads):'-'}</div><div class="s">In Housie: ${c.crm_leads} leads → ${c.crm_visits} visits${c.daily_budget?` · Budget ₹${c.daily_budget}/day`:''}</div><p class="s" style="margin:6px 0">✨ ${E(c.tip)}</p><div class="f" style="margin:0"><button class="g" onclick="campStatus(${c.id},'${c.status==='ACTIVE'?'PAUSED':'ACTIVE'}',${c.daily_budget||0})">${c.status==='ACTIVE'?'Pause':'Launch / Resume'}</button>${c.adset_id?`<button class="g" onclick="campBudget(${c.id})">Change budget</button>`:''}</div></div>`).join(''):'<p class="s">No campaigns yet. Create one below or sync existing ones.</p>')+
  `<div class="card"><b>Create a new ad</b><p class="s">The ad is created paused. Review it, then tap Launch. Ads are billed by Meta to your ad account.</p><div class="f" style="margin-top:8px"><select id="cp">${P.map(p=>`<option value="${p.id}">${E(p.title)}</option>`).join('')}</select><select id="cg"><option value="leads">Collect leads (form)</option><option value="whatsapp">Click to WhatsApp</option></select><input id="cb" type="number" placeholder="Budget ₹/day" value="500"><input id="cd" type="number" placeholder="Days" value="7"><input id="cc" placeholder="City (e.g. Patna)"><input id="cr" type="number" placeholder="Radius km" value="25"><input id="c1" type="number" value="21" style="width:80px"><input id="c2" type="number" value="60" style="width:80px"><input id="ch" placeholder="Headline (max 40)" style="width:100%"><textarea id="ct" placeholder="Ad text (max 125)" style="width:100%"></textarea><button class="g" onclick="fillCopy()">✨ AI writes it</button><button onclick="createAd()">Create (paused)</button></div></div>`}
 if(view==='team'){const X=await api('/team');A.innerHTML=`<h1>My Team</h1><p class="s">${X.members.length} of ${X.seats} seats used · new leads are shared equally and automatically</p><div class="card f" style="margin-top:10px">${X.canInvite?`<input id="in" placeholder="Agent name (optional)"><button onclick="invite()">Create invite link</button>`:'<span class="s">Upgrade to the Agent Team plan to invite agents.</span>'}<div id="il" style="width:100%"></div></div>`+X.members.map(m=>`<div class="card"><div class="f" style="margin:0;justify-content:space-between"><b>${E(m.name)}</b><span class="s">${m.role} · ${m.leads} leads</span></div><div class="s">${E(m.email)}</div>${m.role==='member'?`<button class="g" style="margin-top:8px" onclick="rm(${m.id})">Remove</button>`:''}</div>`).join('')}
 if(view==='visits'){const V=await api('/visits'),L=await api('/leads'),P=await api('/properties');A.innerHTML=`<h1>Site Visits</h1><div class="card f" style="margin-top:10px"><select id="vl">${L.map(l=>`<option value="${l.id}">${E(l.name)}</option>`).join('')}</select><select id="vp">${P.map(p=>`<option value="${p.id}">${E(p.title)}</option>`).join('')}</select><input id="va" type="datetime-local"><button onclick="addVisit()">Schedule + notify</button></div>`+V.map(v=>`<div class="card"><b>${E(v.at)}</b><div class="s">${E(v.lead)} · ${E(v.property)}</div></div>`).join('')}
 if(view==='set'){const me=await api('/me');A.innerHTML=`<h1>Setup</h1><div class="card"><b>Plan: ${E(me.plan)}</b>${me.plan_until?` <span class="s">renews ${new Date(me.plan_until).toLocaleDateString()}</span>`:''}<div class="f" style="margin:8px 0 0"><button onclick="sub('solo')">Subscribe: Solo Agent</button><button class="g" onclick="sub('team')">Subscribe: Agent Team</button></div></div>${me.trial_days_left!=null?`<p class="s">Free trial: <b>${me.trial_days_left} days left</b></p>`:''}<p class="s" style="margin:6px 0">Webhook URL for Meta: <b>${location.origin}/webhooks/meta</b></p><div class="card f"><input id="s3" placeholder="WhatsApp phone number ID" value="${E(me.wa_phone_id)}"><input id="s4" placeholder="WhatsApp token" value="${E(me.wa_token)}"><input id="s7" placeholder="WhatsApp Business Account ID" value="${E(me.wa_waba_id)}"><input id="s6" placeholder="WhatsApp number with country code (91…)" value="${E(me.wa_number)}"><button onclick="saveSet()">Save</button><button class="g" onclick="logout()">Log out</button></div><div class="card"><b>WhatsApp templates</b><p class="s" style="margin:4px 0">WhatsApp only lets you message a client freely for 24 hours after they reply. After that you need approved templates. Save your WhatsApp details above, then create them here.</p><div id="wt"></div><div class="f" style="margin-top:8px"><button onclick="tplSetup()">Create Housie templates</button><button class="g" onclick="tplRefresh()">Refresh status</button></div></div>`;setTimeout(tplLoad,0)}
 }catch(e){if(T)alert(e.message)}}
const go=async f=>{try{await f();draw()}catch(e){alert(e.message)}};
const addLead=()=>go(()=>api('/leads','POST',{name:$('#ln').value,phone:$('#lp').value,budget:$('#lb').value,need:$('#ld').value}));
const stage=(id,s)=>go(()=>api('/leads/'+id,'PATCH',{stage:+s}));
const draft=async()=>{$('#mb').value=(await api(`/leads/${chat}/draft`,'POST')).draft};
const send=async()=>{try{const r=await api(`/leads/${chat}/messages`,'POST',{body:$('#mb').value});if(r.status&&r.status.startsWith('failed'))alert('WhatsApp did not deliver this message. '+r.status.slice(8));draw()}catch(e){if(e.data&&e.data.needs_template)tplPicker();else alert(e.message)}};
const tplPicker=async()=>{let d=$('#tp');if(!d){d=document.createElement('div');d.id='tp';$('#mb').parentElement.after(d)}const T=(await api('/wa/templates?lead='+chat)).filter(t=>t.status==='APPROVED');
 d.innerHTML=T.length?'<p class="s" style="margin:8px 0">More than 24 hours since this client replied. WhatsApp allows only an approved template now:</p>'+T.map(t=>`<div class="card"><div class="s">${E(t.preview)}</div><button style="margin-top:8px" onclick="sendTpl('${t.name}')">Send: ${E(t.label)}</button></div>`).join(''):'<p class="s" style="margin:8px 0">More than 24 hours since this client replied, and no template is approved yet. Ask the team owner to open Setup and create the WhatsApp templates.</p>'};
const sendTpl=async n=>{try{const r=await api(`/leads/${chat}/template`,'POST',{template:n});if(r.status&&r.status.startsWith('failed'))alert('WhatsApp did not deliver this message. '+r.status.slice(8));draw()}catch(e){alert(e.message)}};
const tplLoad=async()=>{try{const T=await api('/wa/templates');$('#wt').innerHTML=T.map(t=>`<div class="s" style="margin:6px 0"><b>${E(t.label)}</b> · ${E(t.status.replace('_',' '))}<br>${E(t.preview)}</div>`).join('')}catch(e){}};
const tplSetup=async()=>{try{await api('/wa/templates/setup','POST');tplLoad();alert('Templates sent to WhatsApp for approval. This usually takes minutes to a day. Tap Refresh status to check.')}catch(e){alert(e.message)}};
const tplRefresh=async()=>{try{await api('/wa/templates/refresh','POST');tplLoad()}catch(e){alert(e.message)}};
const desc=async()=>{$('#pd').value=(await api('/properties/describe','POST',{title:$('#pt').value,area:$('#pa').value,locality:$('#pl').value})).descr};
const addProp=()=>go(()=>api('/properties','POST',{title:$('#pt').value,price:$('#pp').value,area:$('#pa').value,locality:$('#pl').value,descr:$('#pd').value}));
const addVisit=()=>go(()=>api('/visits','POST',{lead_id:+$('#vl').value,property_id:+$('#vp').value,at:$('#va').value}));
const metaLogin=async()=>{try{location.href=(await api('/meta/login')).url}catch(e){alert(e.message)}};
const metaPick=()=>go(()=>api('/meta/select','POST',{page_id:$('#mp').value,ad_account:$('#ma').value}));
const campStatus=(id,st,b)=>{if(st==='ACTIVE'&&!confirm('Start this ad now? Meta will charge your ad account'+(b?' up to ₹'+b+' per day.':'.')))return;go(()=>api('/campaigns/'+id+'/status','POST',{status:st}))};
const campBudget=id=>{const v=prompt('New daily budget in ₹ (100 to 100000)');if(v)go(()=>api('/campaigns/'+id+'/budget','POST',{daily_budget:+v}))};
const fillCopy=async()=>{try{const r=await api('/ads/copy','POST',{property_id:+$('#cp').value});$('#ch').value=r.variants[0].headline;$('#ct').value=r.variants[0].text}catch(e){alert(e.message)}};
const createAd=async()=>{try{await api('/campaigns/create','POST',{property_id:+$('#cp').value,goal:$('#cg').value,daily_budget:+$('#cb').value,days:+$('#cd').value,city:$('#cc').value,radius_km:+$('#cr').value,age_min:+$('#c1').value,age_max:+$('#c2').value,headline:$('#ch').value,text:$('#ct').value});alert('Ad created and paused. Tap Launch when you are ready.')}catch(e){alert(e.message)}draw()};
const adCopy=async()=>{try{const r=await api('/ads/copy','POST',{property_id:+$('#ap').value});$('#ao').innerHTML=r.variants.map(v=>`<div class="card" style="margin-top:8px"><b>${E(v.headline)}</b><div class="s">${E(v.text)}</div></div>`).join('')}catch(e){alert(e.message)}};
const sub=async p=>{try{location.href=(await api('/billing/subscribe','POST',{plan:p})).url}catch(e){alert(e.message)}};
const rm=id=>confirm('Remove this agent? Their leads move to you.')&&go(()=>api('/team/'+id,'DELETE'));
const invite=async()=>{try{const r=await api('/team/invite','POST',{name:$('#in').value});$('#il').innerHTML=`<p class="s">Share this link with your agent:</p><input readonly style="width:100%" value="${r.link}"><button style="background:#25D366;color:#06301a;margin-top:8px" onclick="open('https://wa.me/?text='+encodeURIComponent('Join my team on Housie: ${r.link}'))">Send on WhatsApp</button>`}catch(e){alert(e.message)}};
const shrink=f=>new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(new Error('Could not read image')),'image/jpeg',.82)};i.onerror=()=>no(new Error('This image type is not supported'));i.src=u});
const upPhotos=async(pid,inp)=>{try{for(const f of inp.files){const b=await shrink(f);const r=await fetch('/api/properties/'+pid+'/photos',{method:'POST',headers:{'content-type':'image/jpeg',authorization:'Bearer '+T},body:b});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'Upload failed')}}catch(e){alert(e.message)}draw()};
const delPhoto=id=>confirm('Delete this photo?')&&go(()=>api('/photos/'+id,'DELETE'));
const coverPhoto=id=>go(()=>api('/photos/'+id+'/cover','POST'));
const saveSet=()=>go(()=>api('/settings','PUT',{wa_phone_id:$('#s3').value,wa_token:$('#s4').value,wa_number:$('#s6').value,wa_waba_id:$('#s7').value}));
const mq=new URLSearchParams(location.search).get('meta');if(mq){view='ads';if(mq==='error')setTimeout(()=>alert('Facebook connection failed: '+new URLSearchParams(location.search).get('msg')),400);history.replaceState(null,'','/')}
draw();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
